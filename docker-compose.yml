services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/New_York
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-development-encryption-key-change-me}
      APP_BASE_URL: http://host.docker.internal:3000
      N8N_SHARED_SECRET: ${N8N_SHARED_SECRET:-development-only-secret}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./automation/n8n/data:/home/node/.n8n
      - ./automation/n8n/workflows:/workflows:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
